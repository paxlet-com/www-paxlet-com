services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: www-paxlet-com
    restart: unless-stopped
    ports:
      - "${PORT:-8799}:80"
    environment:
      - APP_ENV=development
    volumes:
      - ./:/var/www/html:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health.php"]
      interval: 15s
      timeout: 5s
      retries: 3
